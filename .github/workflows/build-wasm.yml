name: Build mGBA WASM and publish tests (Fase 0.1)

on:
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: "Versão do Emscripten SDK"
        required: false
        default: "3.1.74"
  push:
    paths:
      - "Passthough-Mashup-V1-Fase-0.1-r2.zip"
      - "Passthough_Mashup_V1_Fase_0.2.1.zip"
      - "Passthough_Mashup_V1_Fase_0.2.1_patch.zip"
      - "Passthough_Mashup_V1_Fase_0.3_readonly_lock.zip"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-wasm.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EMSDK_VERSION: ${{ github.event.inputs.emsdk_version || '3.1.74' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair pacote r2
        run: |
          unzip -q Passthough-Mashup-V1-Fase-0.1-r2.zip -d /tmp/passthough
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/src .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/scripts .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/tests .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/CMakeLists.txt .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/wasm .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/logs .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/README.md .
          cp -a /tmp/passthough/Passthough-Mashup-V1-Fase-0.1-r2/.gitignore .
          sed -i 's/add_compile_definitions(DISABLE_THREADING)/add_compile_definitions(DISABLE_THREADING _GNU_SOURCE _POSIX_C_SOURCE=200809L PATH_MAX=4096)/' CMakeLists.txt
      - name: Aplicar arquivos da Fase 0.2.1
        run: |
          unzip -q Passthough_Mashup_V1_Fase_0.2.1.zip -d /tmp/phase021
          cp -a /tmp/phase021/Passthough-Mashup-V1-Fase-0.1/src/bridge ./src/
          cp -a /tmp/phase021/Passthough-Mashup-V1-Fase-0.1/tests/phase0_2_1.html ./tests/
          cp -a /tmp/phase021/Passthough-Mashup-V1-Fase-0.1/tests/phase0_2_1.js ./tests/

          unzip -q Passthough_Mashup_V1_Fase_0.2.1_patch.zip -d /tmp/patch021
          cp -a /tmp/patch021/Passthough-Mashup-V1-Fase-0.1/src/bridge/Bridge.js ./src/bridge/
          cp -a /tmp/patch021/Passthough-Mashup-V1-Fase-0.1/src/workers/emulator.worker.js ./src/workers/
          cp -a /tmp/patch021/Passthough-Mashup-V1-Fase-0.1/tests/phase0_2_1.js ./tests/
                - name: Aplicar correção read-only da Fase 0.3
         run: |
          unzip -q Passthough_Mashup_V1_Fase_0.3_readonly_lock.zip -d /tmp/phase03lock

          cp -a /tmp/phase03lock/Passthough-Mashup-V1-Fase-0.1/src/state ./src/
          cp -a /tmp/phase03lock/Passthough-Mashup-V1-Fase-0.1/src/workers/emulator.worker.js ./src/workers/
          cp -a /tmp/phase03lock/Passthough-Mashup-V1-Fase-0.1/tests/phase0_3.html ./tests/
          cp -a /tmp/phase03lock/Passthough-Mashup-V1-Fase-0.1/tests/phase0_3.js ./tests/
      - name: Preparar pastas
        run: mkdir -p logs wasm

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Registrar versões das ferramentas
        run: |
          {
            echo "emsdk solicitado: $EMSDK_VERSION"
            emcc --version | head -1
            cmake --version | head -1
            git --version
          } 2>&1 | tee logs/toolchain.txt

      - name: Compilar e verificar artefatos WASM
        run: bash scripts/build_wasm.sh

      - name: Resumo da compilação
        if: always()
        run: |
          {
            echo "## Fase 0.1 — resultado da compilação"
            echo ""
            cat logs/build_result.txt 2>/dev/null || echo "Build sem resultado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fase-0-1
          path: |
            logs/
            build-wasm/CMakeCache.txt
            build-wasm/CMakeFiles/CMakeConfigureLog.yaml
            build-wasm/CMakeFiles/CMakeOutput.log
            build-wasm/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 30

      - name: Preparar site de testes
        if: success()
        run: |
          mkdir -p _site
          cp -a tests src wasm _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Passthough Mashup V1</title>
          <p>Redirecionando para os testes da Fase 0.1…</p>
          <p><a href="tests/phase0_1.html">Abrir testes da Fase 0.1</a></p>
          <script>location.replace(new URL('tests/phase0_1.html', location.href));</script>
          </html>
          HTML

      - name: Configurar GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Enviar página de testes para publicação
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
