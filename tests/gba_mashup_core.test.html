<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste do núcleo GBA — Passthough Mashup</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 14px;background:#101318;color:#e8edf2}
    section{background:#171c23;border:1px solid #39424d;border-radius:12px;padding:14px;margin:12px 0}

  </style>
</head>
<body>
  <h1>Teste do núcleo de integração GBA</h1>

    <button id="run">Executar testes</button>
    <p id="status" class="muted">Aguardando.</p>
    <pre id="output">Nenhum teste executado.</pre>

  <script type="module" src="./gba_mashup_core.test.js"></script>
